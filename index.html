<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ondas · Música libre</title>
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ondas">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
<div id="net" hidden>Sin conexión · solo suenan las descargas</div>
<nav id="nav">
  <h1><i data-i="wave"></i>Ondas</h1>
  <button data-view="search" class="on"><i data-i="search"></i><span>Buscar</span></button>
  <button data-view="library"><i data-i="heart"></i><span>Biblioteca</span></button>
  <button data-view="offline"><i data-i="download"></i><span>Sin conexión</span></button>
  <button data-view="settings"><i data-i="settings"></i><span>Ajustes</span></button>
</nav>
<main id="view"></main>
<footer id="player">
  <div class="now">
    <img id="cover" alt="" src="icon.svg">
    <div><b id="ptitle">Nada en reproducción</b><small id="partist">Busca algo y pulsa play</small></div>
  </div>
  <div class="ctl">
    <div class="btns">
      <button id="shuffle" title="Aleatorio"><i data-i="shuffle"></i></button>
      <button id="prev" title="Anterior"><i data-i="prev"></i></button>
      <button id="play" class="big" title="Reproducir / pausa"><i data-i="play"></i></button>
      <button id="next" title="Siguiente"><i data-i="next"></i></button>
      <button id="repeat" title="Repetir"><i data-i="repeat"></i></button>
    </div>
    <div class="bar"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  </div>
  <div class="vol"><button id="queueBtn" title="Cola"><i data-i="list"></i></button><input id="volume" type="range" min="0" max="1" step="0.01" value="1"></div>
</footer>
<aside id="queue" hidden><h3>Cola <button id="closeQ"><i data-i="x"></i></button></h3><ol id="qlist"></ol></aside>
<div id="toast"></div>
<input id="files" type="file" accept="audio/*" multiple hidden>
<audio id="audio" preload="metadata"></audio>
<script src="app.js?v=6"></script>
</body>
</html>
